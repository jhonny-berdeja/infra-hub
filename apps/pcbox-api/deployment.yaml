# All env vars mirror the table in pcbox-api's README.md and are
# validated as mandatory by src/common/config/env.validation.ts — the Pod
# fails fast at boot if any is missing or malformed.
#
# `pcbox` lives in the consolidated Postgres Pod now (namespace
# `databases`, see databases/jtagram.db.md), not in the old per-app
# `pcbox-db` Pod (databases/pcbox-db.md is history at this point) -- a
# Kubernetes Secret can't be read across namespaces, so
# `postgres-credentials` here is a same-namespace copy of the Secret of
# the same name in `databases` (same POSTGRES_USER/POSTGRES_PASSWORD
# values, created by hand, not synced automatically -- rotate both
# together). `pcbox-ssh-key` is created by hand per
# documentation/pcbox.administrations-deploy.md.
#
# No more `pcbox-api-admin-credentials` Secret / ADMIN_API_KEY -- this
# app verifies callers via iam-api's JWKS now (AUTH_API_URL, unchanged
# variable name -- auth-api's successor after the consolidated Postgres
# cutover, see databases/jtagram.db.md), not a shared secret. See
# src/modules/auth/'s history.
#
# Placeholder image reference. The deploy workflow replaces DOCKERHUB_USER
# with secrets.DOCKERHUB_USERNAME and IMAGE_TAG with the validated deploy
# tag before `kubectl apply`. PCBOX_SSH_HOST_VALUE/PCBOX_SSH_USER_VALUE are
# a second pair of placeholders, substituted the same way from the same
# secrets.SSH_HOST/secrets.SSH_USER CI already uses to reach this server
# directly (see pcbox.bootstrap.md) — never committed as a literal here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pcbox-api
  namespace: pcbox-api
  labels:
    app: pcbox-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pcbox-api
  template:
    metadata:
      labels:
        app: pcbox-api
    spec:
      # Dedicated ServiceAccount for the kubernetes/ module's in-cluster
      # calls to the k8s API -- see rbac/deploy.md for the ServiceAccount/
      # ClusterRole/RoleBindings this name refers to (applied by hand,
      # not by this pipeline). Before this, the Pod ran as the
      # namespace's "default" ServiceAccount, which has no k8s API
      # permissions at all.
      serviceAccountName: pcbox-api
      containers:
        - name: pcbox-api
          image: docker.io/DOCKERHUB_USER/pcbox-api:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: DATABASE_HOST
              value: postgres.databases.svc.cluster.local
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: pcbox
            - name: PORT
              value: "3000"
            - name: LOG_LEVEL
              value: "info"
            - name: AUTH_API_URL
              value: http://iam-api.iam-api.svc.cluster.local:3000
            - name: PCBOX_SSH_HOST
              value: PCBOX_SSH_HOST_VALUE
            - name: PCBOX_SSH_USER
              value: PCBOX_SSH_USER_VALUE
          # TCP, not HTTP: this app exposes no GET route at "/" (only
          # POST /pcbox, guarded by JwtAuthGuard/RolesGuard), so an
          # httpGet probe on "/" would 404 forever and the Pod would
          # never go Ready — same reasoning as ticket-hub-api's own probes.
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          # Private SSH key AnsibleService uses to run playbooks against
          # the real pcbox server — mounted as a read-only file, never an
          # env var (see pcbox-api's documentation/pcbox.administrations-deploy.md).
          volumeMounts:
            - name: ssh-key
              mountPath: /etc/ssh-keys
              readOnly: true
      volumes:
        - name: ssh-key
          secret:
            secretName: pcbox-ssh-key
            defaultMode: 0400
