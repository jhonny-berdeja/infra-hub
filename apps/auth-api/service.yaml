apiVersion: v1
kind: Service
metadata:
  name: auth-api
  namespace: auth-api
spec:
  selector:
    app: auth-api
  # ClusterIP: iam (the frontend) runs as a Pod in this same
  # cluster/namespace (see apps/iam/deployment.yaml) and reaches this API
  # over the in-cluster DNS name (auth-api.auth-api.svc.cluster.local) - no
  # NodePort needed, nothing outside the cluster talks to this API
  # directly. No CORS config needed either, since the browser only ever
  # talks to the Next.js server, never to this backend.
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
