# All 10 env vars mirror the table in ticket-hub-api's README.md and are
# validated as mandatory by src/common/config/env.validation.ts — the Pod
# fails fast at boot if any is missing or malformed.
#
# `ticket-hub-db-credentials` and the `ticket-hub-db` Service are assumed
# to already exist (owned by ticket-hub-db's own setup, not this repo).
# `ticket-hub-api-credentials` is created from secret.example.yaml — see
# apps/ticket-hub-api's usage in this repo's README.md.
# `pcbox-api-notification-credentials` is created by hand per pcbox-api's
# own documentation/pcbox.ticket-hub-db-deploy.md, step 9 — its
# PCBOX_API_ADMIN_KEY must match pcbox-api's own ADMIN_API_KEY exactly.
#
# Placeholder image reference. The deploy workflow replaces DOCKERHUB_USER
# with secrets.DOCKERHUB_USERNAME and IMAGE_TAG with the validated deploy
# tag before `kubectl apply`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-hub-api
  namespace: ticket-hub
  labels:
    app: ticket-hub-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-hub-api
  template:
    metadata:
      labels:
        app: ticket-hub-api
    spec:
      containers:
        - name: ticket-hub-api
          image: docker.io/DOCKERHUB_USER/ticket-hub-api:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ticket-hub-db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticket-hub-db-credentials
                  key: POSTGRES_PASSWORD
            - name: DATABASE_HOST
              value: ticket-hub-db.ticket-hub.svc.cluster.local
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: ticket-hub-db
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ticket-hub-api-credentials
                  key: JWT_SECRET
            # In-cluster URL of auth-api (different namespace, reachable
            # cross-namespace by its FQDN). JwksClientService polls
            # ${AUTH_API_URL}/.well-known/jwks.json every 5 minutes to
            # refresh the RS256 key JwtAuthGuard verifies every token
            # against -- this app no longer trusts its own JWT_SECRET for
            # verification, only for AuthService's now-dead signing call.
            - name: AUTH_API_URL
              value: http://auth-api.auth-api.svc.cluster.local:3000
            - name: PORT
              value: "3000"
            - name: LOG_LEVEL
              value: "info"
            - name: PCBOX_API_URL
              value: http://pcbox-api.pcbox-api.svc.cluster.local:3000
            - name: PCBOX_API_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: pcbox-api-notification-credentials
                  key: PCBOX_API_ADMIN_KEY
          # TCP, not HTTP: the app exposes no GET route at "/" (only
          # POST /users and POST /auth/login), so an httpGet probe on "/"
          # would 404 forever and the Pod would never go Ready.
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
