# Copy this file to secret.yaml, replace the placeholder below with a real
# random value, then `kubectl apply -f apps/iam-api/secret.yaml`.
# NEVER commit secret.yaml — it's gitignored on purpose.
#
# Generate a value: openssl rand -base64 48
apiVersion: v1
kind: Secret
metadata:
  name: iam-api-credentials
  namespace: iam-api
type: Opaque
stringData:
  # RS256 key pair, not a shared HMAC secret -- see
  # iam-api/documentation/generating-jwt-keys.md for how to generate
  # both. Paste each PEM's real newlines via a block scalar, don't
  # collapse them into a single \n-escaped line.
  JWT_PRIVATE_KEY: |
    replace-with-the-generated-private-key-pem
  JWT_PUBLIC_KEY: |
    replace-with-the-generated-public-key-pem
