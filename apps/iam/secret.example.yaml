# Copy this file to secret.yaml, replace the placeholder below with the
# real application name registered in auth-api's `applications` table for
# the admin user that logs into iam, then `kubectl apply -f apps/iam/secret.yaml`.
# NEVER commit secret.yaml -- it's gitignored on purpose.
apiVersion: v1
kind: Secret
metadata:
  name: iam-credentials
  namespace: auth-api
type: Opaque
stringData:
  IAM_APPLICATION_NAME: replace-with-the-registered-application-name
