# Copy this file to secret.yaml, replace the placeholder below with the
# real application name registered in auth-api's `applications` table
# (see the data migration in iam), then
# `kubectl apply -f apps/ticket-hub/secret.yaml`.
# NEVER commit secret.yaml -- it's gitignored on purpose.
apiVersion: v1
kind: Secret
metadata:
  name: ticket-hub-credentials
  namespace: ticket-hub
type: Opaque
stringData:
  TICKET_HUB_APPLICATION_NAME: replace-with-the-registered-application-name
