apiVersion: v1
kind: Service
metadata:
  name: ticket-hub-api
  namespace: ticket-hub
spec:
  selector:
    app: ticket-hub-api
  # ClusterIP: ticket-hub (the frontend) runs as a Pod in this same
  # cluster/namespace (see apps/ticket-hub/deployment.yaml) and reaches
  # this API over the in-cluster DNS name
  # (ticket-hub-api.ticket-hub.svc.cluster.local) - no NodePort needed,
  # nothing outside the cluster talks to this API directly. No CORS
  # config is needed either, since the browser only ever talks to the
  # Next.js server, never to this backend.
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
