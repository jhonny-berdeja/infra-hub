name: Deploy ticket-hub

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to master)"
        required: false
        default: master

concurrency:
  group: deploy-ticket-hub-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ticket-hub to pcbox microk8s.
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repository to access the manifests and scripts.
        uses: actions/checkout@v4

      - name: Save the requested image tag to GITHUB_ENV, defaulting to master.
        run: |
          IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="master"
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Validate the image tag before it reaches later shell commands.
        run: scripts/validate-image-tag.sh "$IMAGE_TAG"

      - name: Join the Tailscale network to reach the microk8s API server.
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:continuous-integration

      - name: Save the kubeconfig to connect to the microk8s cluster.
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PCBOX }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify that the cluster is reachable before applying any manifest.
        run: kubectl get nodes

      - name: Copy the manifest templates to a working directory.
        run: |
          mkdir -p /tmp/ticket-hub-manifests
          cp apps/ticket-hub/deployment.yaml \
             apps/ticket-hub/service.yaml \
             /tmp/ticket-hub-manifests/

      - name: Replace the Docker Hub username and image tag placeholders in the manifests.
        run: |
          sed -i \
            -e "s|DOCKERHUB_USER|${{ secrets.DOCKERHUB_USERNAME }}|g" \
            -e "s|IMAGE_TAG|$IMAGE_TAG|g" \
            /tmp/ticket-hub-manifests/deployment.yaml

      - name: Apply the manifests to the microk8s cluster.
        run: kubectl apply -f /tmp/ticket-hub-manifests/

      - name: Restart the rollout so the new image digest is pulled.
        run: kubectl rollout restart deployment/ticket-hub -n ticket-hub

      - name: Wait for the rollout to finish.
        run: kubectl rollout status deployment/ticket-hub -n ticket-hub --timeout=180s

      - name: Print the deployment status.
        run: kubectl get deployment ticket-hub -n ticket-hub

      - name: Print the running pods.
        run: kubectl get pods -n ticket-hub -l app=ticket-hub

      - name: Print the service.
        run: kubectl get service ticket-hub -n ticket-hub

      - name: Print the deployed image reference.
        run: |
          echo "Deployed image:"
          kubectl get deployment ticket-hub -n ticket-hub -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

      - name: Describe the deployment if the deploy failed.
        if: failure()
        run: kubectl describe deployment ticket-hub -n ticket-hub || true

      - name: Show recent cluster events if the deploy failed.
        if: failure()
        run: kubectl get events -n ticket-hub --sort-by=.lastTimestamp | tail -n 50 || true
