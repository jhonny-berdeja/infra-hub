name: Deploy ticket-hub-api

on:
  repository_dispatch:
    types: [deploy-ticket-hub-api]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to master)"
        required: false
        default: master

concurrency:
  group: deploy-ticket-hub-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to pcbox microk8s
    runs-on: ubuntu-latest
    # Approval gate: both trigger paths (repository_dispatch from
    # ticket-hub-api and the workflow_dispatch fallback) pause here in
    # "Waiting" until a required reviewer on the production Environment
    # approves. No kubectl command in this job runs before that approval.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine image tag
        id: image_tag
        run: |
          TAG="${{ github.event.client_payload.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="master"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Fail-closed validation of attacker-shaped, cross-repo input before
      # it is interpolated into the sed expression and kubectl arguments
      # below, and before any cluster credential is written to disk
      # (design ADR-7).
      - name: Validate image tag
        run: scripts/validate-image-tag.sh "${{ steps.image_tag.outputs.tag }}"

      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:continuous-integration

      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PCBOX }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster reachability
        # Fails fast if the tailnet/API precondition isn't met, before
        # attempting any apply.
        run: kubectl get nodes

      - name: Prepare manifests
        run: |
          mkdir -p /tmp/ticket-hub-api-manifests
          # secret.example.yaml is intentionally excluded: it is a
          # template for a manually created, gitignored secret.yaml, not
          # something CI should ever apply (that would overwrite the real
          # JWT_SECRET with the placeholder value).
          cp apps/ticket-hub-api/namespace.yaml \
             apps/ticket-hub-api/deployment.yaml \
             apps/ticket-hub-api/service.yaml \
             /tmp/ticket-hub-api-manifests/
          sed -i \
            -e "s|DOCKERHUB_USER|${{ secrets.DOCKERHUB_USERNAME }}|g" \
            -e "s|IMAGE_TAG|${{ steps.image_tag.outputs.tag }}|g" \
            /tmp/ticket-hub-api-manifests/deployment.yaml

      - name: Apply manifests
        run: kubectl apply -f /tmp/ticket-hub-api-manifests/

      - name: Restart rollout
        # Tags are mutable (branch-name tags, always "master" in
        # practice). Re-deploying the same tag leaves the manifest
        # unchanged, so `apply` alone produces no diff and no rollout.
        # `imagePullPolicy: Always` is set, so an explicit restart is
        # what actually pulls the new digest.
        run: kubectl rollout restart deployment/ticket-hub-api -n ticket-hub

      - name: Wait for rollout
        run: kubectl rollout status deployment/ticket-hub-api -n ticket-hub --timeout=180s

      - name: Verify deployment
        run: |
          kubectl get deployment ticket-hub-api -n ticket-hub
          kubectl get pods -n ticket-hub -l app=ticket-hub-api
          kubectl get service ticket-hub-api -n ticket-hub
          echo "Deployed image:"
          kubectl get deployment ticket-hub-api -n ticket-hub -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl describe deployment ticket-hub-api -n ticket-hub || true
          kubectl get events -n ticket-hub --sort-by=.lastTimestamp | tail -n 50 || true
