apiVersion: v1
kind: Service
metadata:
  name: ticket-hub
  namespace: ticket-hub
spec:
  selector:
    app: ticket-hub
  # NodePort: this is the app the user opens in a browser from their
  # client PC, so it needs to be reachable from outside the cluster over
  # Tailscale. nodePort is pinned (not auto-assigned) so the URL stays
  # stable across redeploys.
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30301
  type: NodePort
