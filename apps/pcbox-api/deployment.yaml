# All env vars mirror the table in pcbox-api's README.md and are
# validated as mandatory by src/common/config/env.validation.ts — the Pod
# fails fast at boot if any is missing or malformed.
#
# `pcbox-db-credentials` and the `pcbox-db` Service are assumed to
# already exist (owned by pcbox-db's own setup, see pcbox-api's
# documentation/pcbox.pcbox-db-deploy.md). `pcbox-ssh-key` is created by
# hand per documentation/pcbox.administrations-deploy.md.
#
# No more `pcbox-api-admin-credentials` Secret / ADMIN_API_KEY -- this
# app verifies callers via auth-api's JWKS now (AUTH_API_URL), not a
# shared secret. See src/modules/auth/'s history.
#
# Placeholder image reference. The deploy workflow replaces DOCKERHUB_USER
# with secrets.DOCKERHUB_USERNAME and IMAGE_TAG with the validated deploy
# tag before `kubectl apply`. PCBOX_SSH_HOST_VALUE/PCBOX_SSH_USER_VALUE are
# a second pair of placeholders, substituted the same way from the same
# secrets.SSH_HOST/secrets.SSH_USER CI already uses to reach this server
# directly (see pcbox.bootstrap.md) — never committed as a literal here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pcbox-api
  namespace: pcbox-api
  labels:
    app: pcbox-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pcbox-api
  template:
    metadata:
      labels:
        app: pcbox-api
    spec:
      containers:
        - name: pcbox-api
          image: docker.io/DOCKERHUB_USER/pcbox-api:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pcbox-db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pcbox-db-credentials
                  key: POSTGRES_PASSWORD
            - name: DATABASE_HOST
              value: pcbox-db.pcbox-api.svc.cluster.local
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: pcbox-db
            - name: PORT
              value: "3000"
            - name: LOG_LEVEL
              value: "info"
            - name: AUTH_API_URL
              value: http://auth-api.auth-api.svc.cluster.local:3000
            - name: PCBOX_SSH_HOST
              value: PCBOX_SSH_HOST_VALUE
            - name: PCBOX_SSH_USER
              value: PCBOX_SSH_USER_VALUE
          # TCP, not HTTP: this app exposes no GET route at "/" (only
          # POST /pcbox, guarded by JwtAuthGuard/RolesGuard), so an
          # httpGet probe on "/" would 404 forever and the Pod would
          # never go Ready — same reasoning as ticket-hub-api's own probes.
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          # Private SSH key AnsibleService uses to run playbooks against
          # the real pcbox server — mounted as a read-only file, never an
          # env var (see pcbox-api's documentation/pcbox.administrations-deploy.md).
          volumeMounts:
            - name: ssh-key
              mountPath: /etc/ssh-keys
              readOnly: true
      volumes:
        - name: ssh-key
          secret:
            secretName: pcbox-ssh-key
            defaultMode: 0400
