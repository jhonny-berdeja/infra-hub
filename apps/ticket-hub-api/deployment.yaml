# All env vars mirror the table in ticket-hub-api's README.md and are
# validated as mandatory by src/common/config/env.validation.ts — the Pod
# fails fast at boot if any is missing or malformed.
#
# `ticket-hub-db-credentials` and the `ticket-hub-db` Service are assumed
# to already exist (owned by ticket-hub-db's own setup, not this repo).
# `pcbox-api-notification-credentials` is created by hand per this repo's
# own databases/ticket-hub-db.md, step 9 — it now holds
# the apps-user credentials this app logs into iam-api with before
# calling pcbox-api (PCBOX_API_CLIENT_ID/PCBOX_API_CLIENT_SECRET), not a
# shared key with pcbox-api directly anymore.
#
# No `ticket-hub-api-credentials` Secret anymore -- it only ever held
# JWT_SECRET, unused now that this app verifies tokens via iam-api's
# JWKS instead of signing/verifying its own (see AUTH_API_URL below --
# the variable name is unchanged, only the value moved from auth-api to
# iam-api after the consolidated Postgres cutover).
#
# Placeholder image reference. The deploy workflow replaces DOCKERHUB_USER
# with secrets.DOCKERHUB_USERNAME and IMAGE_TAG with the validated deploy
# tag before `kubectl apply`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-hub-api
  namespace: ticket-hub
  labels:
    app: ticket-hub-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-hub-api
  template:
    metadata:
      labels:
        app: ticket-hub-api
    spec:
      containers:
        - name: ticket-hub-api
          image: docker.io/DOCKERHUB_USER/ticket-hub-api:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ticket-hub-db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticket-hub-db-credentials
                  key: POSTGRES_PASSWORD
            - name: DATABASE_HOST
              value: ticket-hub-db.ticket-hub.svc.cluster.local
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: ticket-hub-db
            # In-cluster URL of iam-api (different namespace, reachable
            # cross-namespace by its FQDN; auth-api's successor after the
            # consolidated Postgres cutover -- see
            # databases/jtagram.db.md). JwksClientService polls
            # ${AUTH_API_URL}/.well-known/jwks.json every 5 minutes to
            # refresh the RS256 key JwtAuthGuard verifies every token
            # against -- this app signs and verifies nothing of its own
            # anymore.
            - name: AUTH_API_URL
              value: http://iam-api.iam-api.svc.cluster.local:3000
            - name: PORT
              value: "3000"
            - name: LOG_LEVEL
              value: "info"
            - name: PCBOX_API_URL
              value: http://pcbox-api.pcbox-api.svc.cluster.local:3000
            # The application PcboxApiConnector logs into on iam-api
            # before calling pcbox-api -- must match pcbox-api's own
            # registered application name in iam-api. Not bootstrapped
            # yet post-cutover -- see the open item in
            # databases/iam-admin-bootstrap.md's follow-ups.
            - name: PCBOX_API_APPLICATION_NAME
              value: pcbox-api
            - name: PCBOX_API_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: pcbox-api-notification-credentials
                  key: PCBOX_API_CLIENT_ID
            - name: PCBOX_API_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pcbox-api-notification-credentials
                  key: PCBOX_API_CLIENT_SECRET
          # TCP, not HTTP: the app exposes no GET route at "/" (only
          # POST /tickets and GET /auth/me), so an httpGet probe on "/"
          # would 404 forever and the Pod would never go Ready.
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
